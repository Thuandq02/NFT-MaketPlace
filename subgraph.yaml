specVersion: 0.0.4
description: NFT Marketplace
repository: https://github.com/thuandq02
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: NFTMarketplace
    network: mainnet
    source:
      address: '0xc4Ad7a63900727377bCF9574e1A6cb202a8F5a5A'
      abi: NFTMarketplace
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - MarketItem
      abis:
        - name: NFTMarketplace
          file: ./abis/NFTMarketplace.json
      eventHandlers:
        - event: MarketItemCreated(indexed uint256,address,address,uint256,bool)
          handler: handleMarketItemCreated
        # - event: MarketItemUpdated(indexed uint256,address,address,uint256,bool)
        #   handler: handleMarketItemUpdated
      file: ./src/mapping.ts